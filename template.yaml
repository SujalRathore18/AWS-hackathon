AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: HeatShield AI - explainable heat risk for Indore

Globals:
  Function:
    Runtime: python3.13
    Timeout: 15
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref WeatherTable

Resources:
  WeatherTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: city
          AttributeType: S
      KeySchema:
        - AttributeName: city
          KeyType: HASH

  FetchWeatherFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: fetch_weather.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WeatherTable
      Events:
        Every30Min:
          Type: Schedule
          Properties:
            Schedule: rate(30 minutes)

  GetRiskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: get_risk.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref WeatherTable
      Events:
        RiskApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /risk
            Method: get

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET

  GetRiskErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: get_risk Lambda reported errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref GetRiskFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/risk"
  TableName:
    Value: !Ref WeatherTable
