<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HeatShield AI - Indore</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #1f2937; background: #fff7ed; }
    body { max-width: 620px; margin: auto; padding: 16px; }
    .card { background: white; border: 3px solid #d1d5db; border-radius: 14px; padding: 16px; margin: 14px 0; }
    .Low { border-color: #16a34a; } .Moderate { border-color: #eab308; }
    .High { border-color: #ea580c; } .Extreme { border-color: #dc2626; }
    label { display: block; margin: 14px 0; } select, input, button { font: inherit; padding: 9px; }
    button { cursor: pointer; background: #111827; color: white; border: 0; border-radius: 8px; }
    .level { font-size: 28px; font-weight: 700; } small { color: #6b7280; }
  </style>
</head>
<body>
  <h1>HeatShield AI</h1>
  <p>Explainable heat-risk guidance for students and outdoor workers in Indore.</p>
  <div class="card">
    <label>Activity
      <select id="activity">
        <option value="commute">Commute</option>
        <option value="walking">Walking</option>
        <option value="outdoor_work">Outdoor work</option>
        <option value="sports">Sports</option>
      </select>
    </label>
    <label>Minutes outdoors
      <input id="minutes" type="number" value="60" min="5" max="600">
    </label>
    <label><input id="vulnerable" type="checkbox"> I am more heat-sensitive</label>
    <button id="check">Check my risk</button>
  </div>
  <div id="output" aria-live="polite"></div>
  <script>
    function renderResult(data, demoMode = false) {
      const output = document.getElementById("output");
      output.innerHTML = `<div class="card ${data.level}"><div class="level">${data.level} risk</div>
        <p>${data.why.join(" ")}</p><ul>${data.actions.map(action => `<li>${action}</li>`).join("")}</ul>
        <p>Suggested safe outdoor time: <b>about ${data.safe_minutes} minutes</b>.</p></div>
        <div class="card"><b>Now:</b> ${data.temp_c}°C, ${data.humidity}% humidity,
        feels like ${data.apparent_c}°C. <b>Best hours:</b> ${data.best_hours.join(", ") || "none"}.</div>
        <div class="card"><b>Official warning:</b> ${data.official_alert}</div>
        <small>${demoMode ? "GitHub Pages demo mode. " : ""}Source: ${data.source}. Updated ${data.updated}. ${data.disclaimer}</small>`;
    }
    function demoData(activity, minutes, vulnerable) {
      const offsets = { commute: 1, walking: 2, outdoor_work: 5, sports: 6 };
      const factors = { commute: 1, walking: 0.8, outdoor_work: 0.5, sports: 0.4 };
      const levels = ["Low", "Moderate", "High", "Extreme"];
      const actions = [
        ["Carry water and sip regularly.", "Normal outdoor plans are fine."],
        ["Drink water every 20-30 minutes.", "Take breaks in shade.", "Wear light, loose clothes and a cap."],
        ["Move outdoor tasks to early morning or evening.", "Carry water and rest in shade every 30 minutes."],
        ["Avoid outdoor activity if you can.", "Stop if dizzy, sick or confused and seek help."]
      ];
      const temp = 38;
      const humidity = 55;
      const heatIndex = 52.1;
      let adjusted = heatIndex + offsets[activity];
      if (minutes >= 240) adjusted += 2; else if (minutes >= 120) adjusted += 1;
      if (new Date().getHours() >= 11 && new Date().getHours() < 16) adjusted += 1;
      if (vulnerable) adjusted += 2;
      const index = adjusted >= 51 ? 3 : adjusted >= 39 ? 2 : adjusted >= 32 ? 1 : 0;
      return {
        level: levels[index],
        why: [`Heat index is ${heatIndex}C (${temp}C at ${humidity}% humidity).`,
          `${activity.replace("_", " ").replace(/\b\w/g, letter => letter.toUpperCase())} adds +${offsets[activity]}C of effort.`,
          "GitHub Pages is showing a deterministic demo reading."],
        actions: actions[index],
        safe_minutes: Math.floor([240, 120, 45, 15][index] * factors[activity]),
        temp_c: temp,
        humidity,
        apparent_c: 42,
        best_hours: ["07:00", "08:00"],
        official_alert: "Always check IMD (mausam.imd.gov.in) for official warnings.",
        source: "HeatShield risk model",
        updated: new Date().toISOString(),
        disclaimer: "Awareness tool only. Not medical advice and not a substitute for official IMD warnings."
      };
    }
    async function render() {
      const activity = document.getElementById("activity").value;
      const minutes = Math.max(5, Math.min(600, Number(document.getElementById("minutes").value) || 60));
      const vulnerable = document.getElementById("vulnerable").checked ? "1" : "0";
      const output = document.getElementById("output");
      output.textContent = "Loading live weather...";
      try {
        const response = await fetch(`/risk?activity=${encodeURIComponent(activity)}&minutes=${minutes}&vulnerable=${vulnerable}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Request failed");
        renderResult(data);
      } catch (error) {
        renderResult(demoData(activity, minutes, vulnerable === "1"), true);
      }
    }
    document.getElementById("check").addEventListener("click", render);
    render();
  </script>
</body>
</html>
